<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Vendor Checkout</title>

    <!-- Lets this run full-screen (no browser chrome) once added to the
    home screen, on both iOS Safari and Android Chrome. -->
    <meta name="theme-color" content="#5B3FD9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vendor Checkout" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Controls the preview card shown when this URL is pasted into
    Facebook, Instagram, iMessage, Slack, etc. — without these, a pasted
    link shows no image at all, just plain text. -->
    <meta property="og:title" content="Vendor Checkout" />
    <meta property="og:description" content="Inventory + checkout built for art & craft fair vendors." />
    <meta property="og:image" content="https://vendor-checkout-app.expo.app/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:url" content="https://vendor-checkout-app.expo.app" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vendor Checkout" />
    <meta name="twitter:description" content="Inventory + checkout built for art & craft fair vendors." />
    <meta name="twitter:image" content="https://vendor-checkout-app.expo.app/og-image.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
